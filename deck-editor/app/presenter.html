<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter view - Diapo</title>
<link rel="icon" type="image/svg+xml" href="brand/mark.svg">
<style>
/* ============================================================
   Presenter view. Dark, high contrast, readable from a lectern.
   The two deck frames scale themselves: the deck's own code fits
   the stage into whatever window it gets.
   ============================================================ */
:root {
    --bg: #131417; --panel: #1d1f24; --line: #2c2f36; --ink: #f2f2f4; --ink-2: #b6b8c0; --ink-3: #7d808a; --accent: #4d8dff;
    --ui-font: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--ui-font); overflow: hidden; }
#app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 1fr auto; height: 100%; gap: 14px; padding: 14px; }
.stage { position: relative; background: #000; border-radius: 8px; overflow: hidden; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; pointer-events: none; }
.stage .tag { position: absolute; left: 10px; top: 8px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); background: rgba(0,0,0,0.55); padding: 2px 6px; border-radius: 4px; z-index: 1; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.side .stage { aspect-ratio: 16 / 9; flex: none; }
.notes { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font-size: 20px; line-height: 1.5; white-space: pre-wrap; }
.notes:empty::before { content: "No notes for this slide"; color: var(--ink-3); font-size: 15px; }
.notes-size { display: flex; gap: 4px; justify-content: flex-end; }
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 8px 4px 0; border-top: 1px solid var(--line); }
.time { font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; min-width: 130px; }
.clock { font-variant-numeric: tabular-nums; font-size: 18px; color: var(--ink-2); }
.count { font-size: 18px; color: var(--ink-2); }
.count b { color: var(--ink); font-size: 24px; }
.grow { flex: 1; }
button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--ink-3); }
button.big { font-size: 20px; padding: 6px 18px; }
.empty { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; color: var(--ink-3); font-size: 16px; text-align: center; padding: 20px; background: var(--bg); }
.hint { font-size: 12px; color: var(--ink-3); }
/* The loader while the editor reconnects: a copy of editor.css's .loader (brand/loader.svg), the
   mount turning three quarters and resting upright; after 300 ms; with reduced motion it breathes. */
.loader { width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; opacity: 0; animation: loader-in 0.2s 0.3s forwards; }
.loader .l-turn { transform-box: view-box; transform-origin: 50px 50px; animation: loader-turn 2.6s cubic-bezier(0.7, 0, 0.2, 1.3) infinite; }
.loader .l-breathe { opacity: 0; }
@keyframes loader-in { to { opacity: 1; } }
@keyframes loader-turn { 0% { transform: rotate(0); } 10%, 18% { transform: rotate(90deg); } 28%, 36% { transform: rotate(180deg); } 46%, 54% { transform: rotate(270deg); } 64%, 100% { transform: rotate(360deg); } }
@keyframes loader-breathe { 0%, 100% { opacity: 0; } 50% { opacity: 0.28; } }
@media (prefers-reduced-motion: reduce) { .loader .l-turn { animation: none; } .loader .l-breathe { animation: loader-breathe 2.4s ease-in-out infinite; } }
</style>
</head>
<body>
<div id="app">
  <div class="stage" id="curStage"><span class="tag">Current</span><iframe id="cur" title="Current slide"></iframe><div class="empty" id="curEmpty">Waiting for the editor<span class="hint">Open a deck in the editor window. Arrows here change the slide there too.</span></div></div>
  <div class="side">
    <div class="stage"><span class="tag">Next</span><iframe id="next" title="Next slide"></iframe><div class="empty" id="nextEmpty" hidden>End of the deck</div></div>
    <div class="notes-size"><button data-size="-1" title="Smaller notes">A-</button><button data-size="1" title="Larger notes">A+</button></div>
    <div class="notes" id="notes"></div>
  </div>
  <div class="bar">
    <div class="time" id="time" title="Click to reset the timer">00:00</div>
    <button id="btnReset" title="Reset the timer">Reset</button>
    <div class="clock" id="clock"></div>
    <div class="hint" id="link" hidden><svg class="loader" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g class="l-turn"><rect x="2" y="2" width="96" height="96" rx="7" fill="#EAE3D0"/><rect x="14" y="26" width="72" height="48" rx="1.5" fill="#141418"/><rect class="l-breathe" x="14" y="26" width="72" height="48" rx="1.5" fill="#F7F5EF"/><circle cx="8" cy="92" r="2.6" fill="#8B8574"/></g></svg>Editor closed or reloading. Reconnecting...</div>
    <div class="grow"></div>
    <div class="count"><b id="now">-</b> / <span id="total">-</span> <span id="name" class="hint"></span></div>
    <button class="big" id="btnPrev" title="Previous (Left, PgUp)">&larr;</button>
    <button class="big" id="btnNext" title="Next (Right, Space, PgDn)">&rarr;</button>
  </div>
</div>

<script src="presenter.js"></script>
</body>
</html>
