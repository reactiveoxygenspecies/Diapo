# Tests for Diapo on Windows runners, which is what Diapo ships on. One job rebuilds
# the generated copies (diapo-format/, skills/diapo-deck/, app/templates/) and fails if
# that changes anything, so a copy can't drift silently, then runs the Python tests.
# The browser tests (Playwright, the installed Chrome) are split in three parts
# (--shard), each on a runner of its own, side by side.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Generated copies and Python tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1   # build-known-scripts.py (a release step) needs history; it is not in this check

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check the generated copies are current
        # Rebuilds app/templates/*.html, diapo-format/ and the skill's runtime and
        # controller from their sources; build-templates.py also runs build-format.py,
        # which fails when the skill's annotated base CSS lacks a rule of the base block.
        working-directory: deck-editor
        run: |
          py -3 tools/build-templates.py
          git diff --exit-code -- app/templates ../diapo-format ../skills/diapo-deck

      - name: Python tests
        working-directory: deck-editor
        run: npm run test:py

  browser:
    name: Browser tests ${{ matrix.shard }}/3 (Windows, Chrome)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      DIAPO_TEST_PORT: '8828'   # Playwright's server port; set for every run, as in RELEASING.md
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deck-editor/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: deck-editor
        run: npm ci

      - name: Browser tests (Playwright, installed Chrome), part ${{ matrix.shard }} of 3
        working-directory: deck-editor
        run: npx playwright test --project=chrome --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report and test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            deck-editor/playwright-report/
            deck-editor/test-results/
          if-no-files-found: ignore
          retention-days: 14
